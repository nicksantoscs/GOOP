# Render Blueprint for Goop (free web service). Secrets are set in the dashboard (sync: false), never in git.
services:
  - type: web
    name: goop
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GOOP_CLOUD
        value: "1"
      - key: GOOP_ACCESS_KEY
        sync: false
      - key: GOOP_GARMIN_TOKENS
        sync: false
